name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: code
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run tests (media/ffmpeg via mocks)
        run: python -m pytest tests/ -q
        env:
          # No ffmpeg / no real Agnes keys needed - media calls are mocked.
          DRAMAMATRIX_TTS_ENABLED: "1"
          DRAMAMATRIX_SUBTITLES_ENABLED: "1"